name: Vérifier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Charge la fonction sous le vrai Node : les tests Vitest
      # transforment les imports et ne voient pas les erreurs ESM.
      - run: npm run smoke
